<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1723">
<title>海战模拟器</title>
<style>
  :root{
    --bg:#0b1723; --panel:#12202e; --panel2:#172939; --line:#20374b;
    --txt:#dbe7f2; --dim:#7f97ad; --acc:#3fa9f5; --acc2:#25d0a5;
    --warn:#f5b942; --err:#f2555a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 600px at 50% -10%,#16324a 0%,var(--bg) 60%);
    color:var(--txt);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:900px;margin:0 auto;padding:16px;min-height:100%;display:flex;flex-direction:column}
  h1{font-size:20px;margin:0;letter-spacing:.5px}
  h1 span{color:var(--acc)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  /* 登录 */
  #login{max-width:380px;margin:8vh auto 0;width:100%}
  #login p.sub{color:var(--dim);font-size:13px;margin:6px 0 18px}
  label{display:block;font-size:13px;color:var(--dim);margin:12px 0 6px}
  input{
    width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);font-size:16px;outline:none;
  }
  input:focus{border-color:var(--acc)}
  button{
    cursor:pointer;border:none;border-radius:10px;padding:11px 14px;font-size:15px;
    background:var(--acc);color:#04121d;font-weight:600;transition:.15s;
  }
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:400}
  .row{display:flex;gap:10px;align-items:center}
  .msg{margin-top:14px;font-size:13px;min-height:18px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--acc2)}
  /* 主界面 */
  #app{display:none;flex-direction:column;gap:12px;height:100%}
  header.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .who{font-size:13px;color:var(--dim)}
  .who b{color:var(--txt)}
  .res{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
        padding:3px 10px;font-size:12px;color:var(--dim)}
  .chip b{color:var(--txt);font-weight:600}
  #console{flex:1;overflow-y:auto;padding:12px;background:#0a1420;border:1px solid var(--line);
           border-radius:14px;min-height:240px;max-height:52vh;font-size:14px}
  .line{padding:8px 10px;border-radius:10px;margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
  .line.me{background:#16324a;margin-left:12%}
  .line.bot{background:var(--panel2)}
  .line.sys{background:transparent;color:var(--dim);font-size:12px;padding:2px 10px}
  .line.err{background:#3a1a1e;color:#ffc9cb}
  .quick{display:flex;flex-wrap:wrap;gap:6px}
  .quick button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
                font-weight:400;padding:7px 11px;font-size:13px}
  .inputbar{display:flex;gap:8px}
  .inputbar input{flex:1}
  #islands{font-size:13px;color:var(--dim)}
  #islands b{color:var(--txt)}
  .banner{background:#3a2f14;border:1px solid #6b5520;color:#ffdf9b;
          padding:12px 14px;border-radius:12px;font-size:13px;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录 -->
  <div id="login" class="card">
    <h1>⚓ 海战<span>模拟器</span></h1>
    <p class="sub">用 QQ 号 + Web 口令登录</p>
    <label for="qq">QQ 号</label>
    <input id="qq" inputmode="numeric" autocomplete="username" placeholder="例如 2243683821">
    <label for="pw">Web 口令</label>
    <input id="pw" type="password" autocomplete="current-password" placeholder="注册时设置的口令">
    <div class="row" style="margin-top:18px">
      <button id="btnLogin" style="flex:1">登录</button>
    </div>
    <div class="msg" id="loginMsg"></div>
    <p class="sub" style="margin-top:16px">
      还没注册？在 QQ 里发：<br><code>/nw注册 &lt;势力名&gt; &lt;口令&gt;</code>
    </p>
  </div>

  <!-- 强制设口令 -->
  <div id="setup" class="card" style="display:none;max-width:380px;margin:8vh auto 0">
    <div class="banner">该账号还没有 Web 口令，请先设置一个再开始游戏。</div>
    <label for="npw">新口令（至少 4 位，不能全数字）</label>
    <input id="npw" type="password" autocomplete="new-password">
    <label for="npw2">再输一次</label>
    <input id="npw2" type="password" autocomplete="new-password">
    <div class="row" style="margin-top:18px">
      <button id="btnSet" style="flex:1">设置口令</button>
      <button id="btnQuit" class="ghost">退出</button>
    </div>
    <div class="msg" id="setupMsg"></div>
  </div>

  <!-- 主界面 -->
  <div id="app">
    <header class="bar">
      <div>
        <h1 id="factionName">⚓ 海战模拟器</h1>
        <div class="who" id="who"></div>
        <div class="res" id="res"></div>
      </div>
      <button class="ghost" id="btnLogout">退出</button>
    </header>
    <div class="quick" id="quick"></div>
    <div id="console"></div>
    <div class="inputbar">
      <input id="cmd" placeholder="输入指令，如：我 / 建造 矿场 / 研究 驱逐舰 T3" autocomplete="off">
      <button id="btnSend">发送</button>
    </div>
    <div id="islands"></div>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
let TOKEN = localStorage.getItem('nw_token') || '';
let needSet = false;
let polling = null;

async function api(path, opts = {}) {
  const headers = Object.assign({'Content-Type': 'application/json'}, opts.headers || {});
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok || data.ok === false) {
    const e = new Error(data.error || ('HTTP ' + res.status));
    e.status = res.status;
    throw e;
  }
  return data;
}

function say(text, cls = 'bot') {
  const div = document.createElement('div');
  div.className = 'line ' + cls;
  div.textContent = text;
  $('console').appendChild(div);
  $('console').scrollTop = $('console').scrollHeight;
}

function fmt(n) {
  if (n === null || n === undefined) return '0';
  return Math.abs(n) >= 1000 ? Math.round(n).toLocaleString() : (Math.round(n * 10) / 10);
}

const RES = [['steel','钢'],['oil','油'],['aluminium','铝'],['rare_earth','稀土'],
             ['chips','芯片'],['food','食物'],['supply','补给'],['manpower','人力'],
             ['money','资金'],['science','科研'],['intel','情报']];

function renderPlayer(p) {
  if (!p || !p.name) return;
  $('factionName').textContent = '⚓ ' + p.name;
  $('who').innerHTML = 'QQ <b>' + p.qq + '</b>　首都 (' + p.capital_x + ',' + p.capital_y +
                       ')　恶名 <b>' + (p.infamy ?? 0) + '</b>　民心 <b>' + fmt(p.morale) + '</b>';
  $('res').innerHTML = RES.map(([k, label]) =>
    '<span class="chip">' + label + ' <b>' + fmt(p[k]) + '</b></span>').join('');
}

function renderIslands(list) {
  if (!list || !list.length) { $('islands').textContent = ''; return; }
  $('islands').innerHTML = '🏝 领地 ' + list.length + ' 座：' + list.map(i => {
    const ore = Object.entries(i.ore || {}).map(([k,v]) => k + '★' + v).join(' ');
    return '<b>(' + i.x + ',' + i.y + ')</b> D' + i.dev_level + (ore ? ' ' + ore : '');
  }).join('　|　');
}

const QUICK = ['我','资源','岛','队列','排行','帮助','研究 驱逐舰 T3','设计','设计列表','船坞','舰队','海图','战报'];

function renderQuick() {
  $('quick').innerHTML = '';
  QUICK.forEach(c => {
    const b = document.createElement('button');
    b.textContent = c;
    b.onclick = () => send(c);
    $('quick').appendChild(b);
  });
}

function show(view) {
  $('login').style.display = view === 'login' ? '' : 'none';
  $('setup').style.display = view === 'setup' ? '' : 'none';
  $('app').style.display = view === 'app' ? 'flex' : 'none';
}

async function boot() {
  if (!TOKEN) return show('login');
  try {
    const d = await api('/api/me');
    if (d.need_set_password) { needSet = true; return show('setup'); }
    enterGame(d);
  } catch (e) {
    TOKEN = ''; localStorage.removeItem('nw_token'); show('login');
  }
}

function enterGame(d) {
  show('app');
  renderPlayer(d.player);
  renderIslands(d.islands);
  renderQuick();
  say('⚓ 欢迎回来，提督。输入指令开始，或点上方快捷按钮。', 'sys');
  if (!polling) polling = setInterval(pollEvents, 10000);
}

async function pollEvents() {
  if (!TOKEN) return;
  try {
    const d = await api('/api/events');
    (d.events || []).forEach(ev => say(ev.text, 'bot'));
    if ((d.events || []).length) {
      const me = await api('/api/me');
      renderPlayer(me.player);
    }
  } catch (e) { /* 轮询失败静默 */ }
}

async function send(text) {
  text = (text || '').trim();
  if (!text) return;
  if (needSet) return;
  say(text, 'me');
  $('cmd').value = '';
  try {
    const d = await api('/api/cmd', {method:'POST', body: JSON.stringify({text})});
    (d.replies || []).forEach(r => say(r, 'bot'));
    if (d.player) renderPlayer(d.player);
  } catch (e) {
    say(e.message, 'err');
    if (e.status === 403) { needSet = true; show('setup'); }
  }
}

/* ---- 事件绑定 ---- */
$('btnLogin').onclick = async () => {
  const qq = $('qq').value.trim(), pw = $('pw').value;
  $('loginMsg').textContent = '';
  if (!qq) { $('loginMsg').className = 'msg err'; $('loginMsg').textContent = '请输入 QQ 号'; return; }
  $('btnLogin').disabled = true;
  try {
    const d = await api('/api/login', {method:'POST', body: JSON.stringify({qq, password: pw})});
    TOKEN = d.token; localStorage.setItem('nw_token', TOKEN);
    if (d.need_set_password) { needSet = true; show('setup'); }
    else { needSet = false; const me = await api('/api/me'); enterGame(me); }
  } catch (e) {
    $('loginMsg').className = 'msg err'; $('loginMsg').textContent = e.message;
  } finally { $('btnLogin').disabled = false; }
};

$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnLogin').click(); });

$('btnSet').onclick = async () => {
  const a = $('npw').value, b = $('npw2').value;
  const m = $('setupMsg'); m.className = 'msg err'; m.textContent = '';
  if (a !== b) { m.textContent = '两次输入不一致'; return; }
  try {
    const d = await api('/api/password', {method:'POST', body: JSON.stringify({new_password: a})});
    TOKEN = d.token; localStorage.setItem('nw_token', TOKEN);
    needSet = false;
    m.className = 'msg ok'; m.textContent = '口令已设置';
    const me = await api('/api/me'); enterGame(me);
  } catch (e) { m.textContent = e.message; }
};

$('btnQuit').onclick = doLogout;
$('btnLogout').onclick = doLogout;
async function doLogout() {
  try { await api('/api/logout', {method:'POST'}); } catch (e) {}
  TOKEN = ''; localStorage.removeItem('nw_token');
  if (polling) { clearInterval(polling); polling = null; }
  location.reload();
}

$('btnSend').onclick = () => send($('cmd').value);
$('cmd').addEventListener('keydown', e => { if (e.key === 'Enter') send($('cmd').value); });

boot();
</script>
</body>
</html>
