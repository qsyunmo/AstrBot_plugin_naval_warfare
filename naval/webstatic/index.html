<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1723">
<title>海战模拟器</title>
<style>
  :root{
    --bg:#0b1723; --panel:#12202e; --panel2:#172939; --line:#20374b;
    --txt:#dbe7f2; --dim:#7f97ad; --acc:#3fa9f5; --acc2:#25d0a5;
    --warn:#f5b942; --err:#f2555a; --gold:#e8c46a;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:radial-gradient(1200px 600px at 50% -10%,#16324a 0%,var(--bg) 60%);
    color:var(--txt);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:980px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  h1{font-size:19px;margin:0;letter-spacing:.5px}
  h1 span{color:var(--acc)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
        background:var(--panel2);color:var(--txt);font-size:16px;outline:none}
  input:focus{border-color:var(--acc)}
  button{cursor:pointer;border:none;border-radius:10px;padding:10px 14px;font-size:14px;
         background:var(--acc);color:#04121d;font-weight:600;transition:.15s}
  button:hover{filter:brightness(1.1)}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:400}
  button:disabled{opacity:.5;cursor:not-allowed}
  label{display:block;font-size:13px;color:var(--dim);margin:12px 0 6px}
  .row{display:flex;gap:10px;align-items:center}
  .msg{margin-top:12px;font-size:13px;min-height:18px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--acc2)}
  #login,#setup{max-width:380px;margin:7vh auto 0;width:100%}
  .banner{background:#3a2f14;border:1px solid #6b5520;color:#ffdf9b;padding:12px 14px;
          border-radius:12px;font-size:13px;margin-bottom:10px}
  /* 主界面 */
  #app{display:none;flex-direction:column;gap:12px}
  header.bar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .who{font-size:13px;color:var(--dim)}
  .who b{color:var(--txt)}
  .res{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
        padding:3px 10px;font-size:12px;color:var(--dim)}
  .chip b{color:var(--txt);font-weight:600}
  /* 标签页 */
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{background:var(--panel2);color:var(--dim);border:1px solid var(--line);font-weight:400}
  .tabs button.on{background:var(--acc);color:#04121d;border-color:var(--acc);font-weight:600}
  .pane{display:none;flex-direction:column;gap:12px}
  .pane.on{display:flex}
  /* 海图 */
  #mapBox{position:relative;background:#08131f;border:1px solid var(--line);border-radius:14px;padding:12px}
  canvas{width:100%;height:auto;display:block;border-radius:8px;touch-action:manipulation}
  .maptools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--dim)}
  .maptools input[type=range]{flex:1;min-width:120px;padding:0;background:transparent;border:none}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:8px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;
            vertical-align:-1px;font-style:normal}
  #tip{position:absolute;pointer-events:none;background:#04121d;border:1px solid var(--acc);
       border-radius:8px;padding:6px 9px;font-size:12px;display:none;z-index:5;white-space:nowrap}
  /* 列表 */
  .list{display:flex;flex-direction:column;gap:8px}
  .item{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
  .item b{color:var(--txt)}
  .item .sub{color:var(--dim);font-size:12px;margin-top:3px}
  .empty{color:var(--dim);font-size:13px;padding:8px 2px}
  .bar{height:7px;background:#0a1a26;border-radius:5px;overflow:hidden;margin-top:5px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
  /* 控制台 */
  #console{height:44vh;min-height:200px;overflow-y:auto;padding:12px;background:#0a1420;
           border:1px solid var(--line);border-radius:14px;font-size:14px}
  .line{padding:8px 10px;border-radius:10px;margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
  .line.me{background:#16324a;margin-left:12%}
  .line.bot{background:var(--panel2)}
  .line.sys{background:transparent;color:var(--dim);font-size:12px;padding:2px 10px}
  .line.err{background:#3a1a1e;color:#ffc9cb}
  .quick{display:flex;flex-wrap:wrap;gap:6px}
  .quick button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
                font-weight:400;padding:7px 11px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">

  <div id="login" class="card">
    <h1>⚓ 海战<span>模拟器</span></h1>
    <p style="color:var(--dim);font-size:13px;margin:6px 0 14px">用 QQ 号 + Web 口令登录</p>
    <label for="qq">QQ 号</label>
    <input id="qq" inputmode="numeric" autocomplete="username" placeholder="例如 2243683821">
    <label for="pw">Web 口令</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:16px"><button id="btnLogin" style="flex:1">登录</button></div>
    <div class="msg" id="loginMsg"></div>
    <p style="color:var(--dim);font-size:12px;margin-top:14px">
      还没注册？在 QQ 里发：<br><code>nw注册 &lt;势力名&gt; &lt;口令&gt;</code>
    </p>
  </div>

  <div id="setup" class="card">
    <div class="banner">该账号还没有 Web 口令，请先设置一个再开始游戏。</div>
    <label for="npw">新口令（至少 4 位，不能全数字）</label>
    <input id="npw" type="password" autocomplete="new-password">
    <label for="npw2">再输一次</label>
    <input id="npw2" type="password" autocomplete="new-password">
    <div class="row" style="margin-top:16px">
      <button id="btnSet" style="flex:1">设置口令</button>
      <button id="btnQuit" class="ghost">退出</button>
    </div>
    <div class="msg" id="setupMsg"></div>
  </div>

  <div id="app">
    <header class="bar">
      <div>
        <h1 id="factionName">⚓ 海战模拟器</h1>
        <div class="who" id="who"></div>
        <div class="res" id="res"></div>
      </div>
      <button class="ghost" id="btnLogout">退出</button>
    </header>

    <div class="tabs" id="tabs"></div>

    <div class="pane on" id="pane-map">
      <div id="mapBox">
        <canvas id="cv" width="840" height="840"></canvas>
        <div id="tip"></div>
      </div>
      <div class="maptools">
        <span>视野半径</span>
        <input type="range" id="radius" min="4" max="25" value="10">
        <span id="radiusVal">10</span>
        <button class="ghost" id="btnRefreshMap">刷新</button>
        <button class="ghost" id="btnMapReset" style="display:none">↺ 回到首都</button>
      </div>
      <div class="legend">
        <span><i style="background:#3fa9f5"></i>首都</span>
        <span><i style="background:#25d0a5"></i>己方岛屿</span>
        <span><i style="background:#4a6377"></i>其他岛屿</span>
        <span><i style="background:#f5b942"></i>海盗据点</span>
        <span><i style="background:#f2555a"></i>海盗巡逻队</span>
        <span><i style="background:#e8c46a"></i>中立商船</span>
        <span><i style="background:#ff6b3d"></i>执法者</span>
        <span><i style="background:#d94f4f"></i>正规军</span>
        <span><i style="background:#e07b39"></i>叛军</span>
        <span><i style="background:#b07bff"></i>雲墨</span>
        <span><i style="background:#9fb3c8"></i>残骸</span>
        <span><i style="background:#25d0a5"></i>同盟</span>
        <span><i style="background:#f2555a"></i>交战</span>
        <span><i style="background:#5fd0ff"></i>中立保护</span>
        <span><i style="background:#f5b942"></i>NAP/飞地</span>
        <span><i style="background:#c98cff"></i>己方舰队</span>
        <span id="fogLegend" style="display:none"><i style="background:#0a1520;border:1px solid #20374b"></i>未探明（迷雾）</span>
      </div>
      <div class="list" id="mapEntities"></div>
    </div>

    <div class="pane" id="pane-design">
      <div class="list" id="designList"></div>
    </div>

    <div class="pane" id="pane-fleet">
      <div class="list" id="fleetComposer"></div>
      <div class="list" id="fleetList"></div>
    </div>

    <div class="pane" id="pane-diplo">
      <div class="list" id="diploList"></div>
    </div>

    <div class="pane" id="pane-tech">
      <div class="list" id="researchActions"></div>
      <div class="list" id="techList"></div>
    </div>

    <div class="pane" id="pane-battle">
      <div class="list" id="battleList"></div>
      <div class="list" id="battleView"></div>
    </div>

    <div class="pane" id="pane-build">
      <div class="list" id="buildList"></div>
    </div>

    <div class="pane" id="pane-assets">
      <div class="list" id="assetList"></div>
      <div class="list" id="codexList"></div>
    </div>

    <div class="pane" id="pane-cmd">
      <div class="quick" id="quick"></div>
      <div id="console"></div>
      <div class="row">
        <input id="cmd" placeholder="输入指令，如：我 / 建造 矿场 / 研究 驱逐舰 T3" autocomplete="off">
        <button id="btnSend">发送</button>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let TOKEN = localStorage.getItem('nw_token') || '';
let needSet = false, polling = null, mapData = null, radius = 10;

async function api(path, opts = {}) {
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers || {});
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok || data.ok === false) {
    const e = new Error(data.error || ('HTTP ' + res.status)); e.status = res.status; throw e;
  }
  return data;
}
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(n){ if(n==null) return '0'; return Math.abs(n)>=1000 ? Math.round(n).toLocaleString() : (Math.round(n*10)/10); }

/* ---------- 登录 ---------- */
function show(v){
  $('login').style.display = v==='login' ? '' : 'none';
  $('setup').style.display = v==='setup' ? '' : 'none';
  $('app').style.display   = v==='app'   ? 'flex' : 'none';
}
async function boot(){
  if (!TOKEN) return show('login');
  try {
    const d = await api('/api/me');
    if (d.need_set_password) { needSet = true; return show('setup'); }
    enterGame(d);
  } catch(e){ TOKEN=''; localStorage.removeItem('nw_token'); show('login'); }
}
function enterGame(d){
  show('app');
  renderPlayer(d.player);
  buildTabs();
  loadMap(); loadAssets();
  say('⚓ 欢迎回来，提督。可用标签页查看海图/舰队/图鉴，或直接发指令。','sys');
  if (!polling) polling = setInterval(pollEvents, 10000);
}

/* ---------- 顶栏 ---------- */
const RES = [['steel','钢'],['oil','油'],['aluminium','铝'],['rare_earth','稀土'],['chips','芯片'],
             ['food','食物'],['supply','补给'],['manpower','人力'],['money','资金'],
             ['science','科研'],['intel','情报']];
function renderPlayer(p){
  if (!p || !p.name) return;
  $('factionName').textContent = '⚓ ' + p.name;
  const bits = ['QQ <b>'+esc(p.qq)+'</b>',
                '首都 ('+p.capital_x+','+p.capital_y+')',
                '恶名 <b>'+(p.infamy??0)+'</b>',
                '民心 <b>'+fmt(p.morale)+'</b>'];
  if (p.wanted_heat != null) bits.push('通缉热度 <b>'+fmt(p.wanted_heat)+'</b>');
  if (p.route_security != null) bits.push('航线安全 <b>'+fmt(p.route_security)+'</b>');
  if (p.is_neutral) bits.push('<span style="color:#5fd0ff">🕊 中立观察国</span>');
  $('who').innerHTML = bits.join('　');
  $('res').innerHTML = RES.map(([k,l]) =>
    '<span class="chip">'+l+' <b>'+fmt(p[k])+'</b></span>').join('');
}

/* ---------- 标签页 ---------- */
const TABS = [['map','🗺 海图'],['build','🏗 建造'],['design','📐 组装'],
              ['fleet','⚓ 舰队'],['assets','📦 势力'],['tech','🔬 科技'],
              ['diplo','🕊 外交'],['battle','🎬 战报'],['cmd','💬 指令']];
let curTab = 'map';
function buildTabs(){
  if ($('tabs').children.length) return;
  TABS.forEach(([k,label]) => {
    const b = document.createElement('button');
    b.textContent = label; b.dataset.k = k;
    b.onclick = () => switchTab(k);
    $('tabs').appendChild(b);
  });
  switchTab('map');
}
function switchTab(k){
  curTab = k;
  [...$('tabs').children].forEach(b => b.classList.toggle('on', b.dataset.k === k));
  TABS.forEach(([t]) => $('pane-'+t).classList.toggle('on', t === k));
  if (k === 'map') loadMap();
  if (k === 'build') loadBuild();
  if (k === 'design') loadDesign();
  if (k === 'fleet') loadFleetComposer();
  if (k === 'tech') loadResearchOptions();
  if (k === 'fleet' || k === 'assets' || k === 'diplo' || k === 'tech') loadAssets();
  if (k === 'battle') loadBattles();
}

/* ---------- 图形化组装（设计舰船） ---------- */
let dsn = null;          // design_options 数据
let dsnChosen = {};      // {slot: module_id}
let dsnPreview = null;
async function loadDesign(cls){
  const box = $('designList');
  box.innerHTML = '<div class="empty">载入中…</div>';
  try {
    const d = await api('/api/design_options' + (cls ? ('?cls=' + cls) : ''));
    dsn = d;
    // 默认每个槽位选「已拥有的第一个」（必选槽优先）
    dsnChosen = {};
    d.slots.forEach(s => {
      const pick = s.options.find(o => o.owned);
      if (pick) dsnChosen[s.key] = pick.id;
    });
    renderDesign();
  } catch(e){
    box.innerHTML = '<div class="empty">组装面板加载失败：'+esc(e.message)+'</div>';
  }
}
function renderDesign(){
  const box = $('designList');
  const out = [];
  // 舰种切换
  out.push('<div class="item" style="display:flex;flex-wrap:wrap;gap:6px">'
    + dsn.classes.map(c => '<button class="ghost'+(c.id===dsn.cls?' on':'')+
        '" data-dc="'+c.id+'">'+esc(c.name)+'</button>').join('')
    + '</div>');
  out.push('<div class="item"><b>📐 组装【'+esc(dsn.cls_name)+'】</b>'
    + '　基础耐久 '+dsn.base_hp
    + '<div class="sub">逐槽点选模块（✅已拥有 / 🔒未研究，点已拥有的即可）；'
    + '↑↓ 数字为 T 级与稀有度。右边实时预览，满意后填名字保存。</div></div>');
  // 槽位选择
  out.push('<div class="item">' + dsn.slots.map(s => {
    const cur = dsnChosen[s.key];
    const curOpt = s.options.find(o => o.id === cur);
    const owned = s.options.filter(o => o.owned);
    const locked = s.options.filter(o => !o.owned);
    const req = s.required ? '<span style="color:#f5b942">★必选</span>' : '';
    const head = '<div class="sub" style="padding:6px 0"><b>'+
      (s.required?'★':'　')+esc(s.name)+'</b> '+req+
      '　<span style="color:#7f97ad">已拥有 '+s.owned_count+'/'+s.options.length+'</span>'
      + (curOpt ? ('　当前：<b>'+esc(curOpt.name)+'</b> T'+curOpt.tier
                  + ' '+esc(curOpt.rarity_name)) : '　<span style="color:#f5b942">未选</span>')
      + (s.required && !cur ? ' <span style="color:#f2555a">（必选，缺了不能保存）</span>' : '')
      + '</div>';
    const btn = (o) => '<button class="ghost'+(o.id===cur?' on':'')+'" data-ds="'+
      s.key+'" data-dm="'+o.id+'"'+(o.owned?'':' disabled')
      + ' title="'+esc(Object.entries(o.stats).map(([k,v])=>k+':'+v).join(' '))+'"'
      + '>'+esc(o.name)+'<br><span style="font-size:10px;opacity:.75">T'+o.tier
      + ' '+esc(o.rarity_name)+(o.owned?'':' 🔒')+'</span></button>';
    return head
      + '<div style="display:flex;flex-wrap:wrap;gap:5px">'
      + (owned.length ? owned.map(btn).join('')
         : '<span style="color:#f2555a">该槽位还没有可用模块，先去「🔬 科技」研究</span>')
      + (locked.length ? '<details style="width:100%"><summary style="cursor:pointer;'
         + 'color:#7f97ad;font-size:12px">🔒 未研究（'+locked.length+'）</summary>'
         + '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:5px">'
         + locked.map(btn).join('') + '</div></details>' : '')
      + '</div>';
  }).join('') + '</div>');
  // 预览 + 保存
  out.push('<div class="item" id="dsnPreview"><b>🔍 预览</b>'
    + '<div class="sub">计算中…</div></div>');
  // 已存设计
  out.push('<div class="item" id="dsnSaved"><b>📐 我的设计（'+dsn.designs.length+'）</b>'
    + (dsn.designs.length ? dsn.designs.map(d =>
        '<div class="sub">#'+d.id+' <b>'+esc(d.name)+'</b>　'+esc(d.cls_name)
        +' T'+d.tier+'　造价 '
        + Object.entries(d.cost||{}).filter(([,v])=>v).map(([k,v])=>k+v).join(' ')
        + '　工时 '+esc(d.work_text)
        + '　<button class="ghost" data-prod="'+d.id+'" data-pname="'+esc(d.name)+'">'
        + '去生产</button></div>').join('')
      : '<div class="sub">还没有设计。选好模块后填名字保存。</div>')
    + '</div>');
  box.innerHTML = out.join('');
  box.querySelectorAll('button[data-dc]').forEach(b => {
    b.onclick = () => loadDesign(b.dataset.dc);
  });
  box.querySelectorAll('button[data-ds]').forEach(b => {
    b.onclick = () => { dsnChosen[b.dataset.ds] = b.dataset.dm; renderDesign(); };
  });
  box.querySelectorAll('button[data-prod]').forEach(b => {
    b.onclick = () => {
      switchTab('cmd'); $('cmd').value = '生产 ' + b.dataset.pname + ' 1'; $('cmd').focus();
    };
  });
  refreshPreview();
}
async function refreshPreview(){
  const box = $('dsnPreview');
  if (!box) return;
  try {
    const pv = await api('/api/design_preview', {method:'POST',
      body: JSON.stringify({cls: dsn.cls, modules: dsnChosen})});
    dsnPreview = pv;
    const miss = (pv.missing_required||[]);
    const costTxt = Object.entries(pv.cost||{}).filter(([,v])=>v)
      .map(([k,v])=>k+v).join(' ') || '0';
    box.innerHTML = '<b>🔍 预览</b>　T'+pv.tier
      + '<div class="sub">'+esc(pv.stats_text||'')+'</div>'
      + '<div class="sub">单舰造价：'+esc(costTxt)+'　工时 '+esc(pv.work_text)+'</div>'
      + (miss.length ? '<div class="sub" style="color:#f2555a">还缺必选槽：'
          + esc(miss.join('、'))+'</div>' : '')
      + '<div class="sub" style="margin-top:6px">'
      + '<input id="dsnName" placeholder="方案名（最多8字）" maxlength="8" '
      + 'style="padding:4px 8px;border-radius:4px;border:1px solid #2a3d4d;'
      + 'background:#0d1a24;color:#dfe9f3;width:140px">　'
      + '<button class="ghost" id="dsnSave"'+(miss.length?' disabled':'')+'>'
      + '💾 保存设计</button></div>';
    const sv = $('dsnSave');
    if (sv) sv.onclick = doSaveDesign;
  } catch(e){
    box.innerHTML = '<b>🔍 预览</b><div class="sub">预览失败：'+esc(e.message)+'</div>';
  }
}
async function doSaveDesign(){
  const nm = ($('dsnName')?.value || '').trim();
  if (!nm){ say('请先填方案名', 'err'); $('dsnName')?.focus(); return; }
  try {
    const d = await api('/api/design_save', {method:'POST', body: JSON.stringify({
      name: nm, cls: dsn.cls, modules: dsnChosen })});
    say(d.text || '已保存', 'ok');
    dsn = d.options; renderDesign();
    loadAssets();
  } catch(e){ say('保存失败：'+e.message, 'err'); }
}

/* ---------- 图形化研究 ---------- */
let rschData = null, rschCls = null;
async function loadResearchOptions(){
  const box = $('researchActions');
  if (!box) return;

/* ---------- 图形化编队 ---------- */
let fleetData = null;
let fleetDraft = {};      // {fleet_id: [{name, qty}, ...]} 编辑中的编成草稿

/* 当前港区（含其它舰队在编）里可选的舰名，按「港区多的在前」排序 */
function _nameChoices(){
  const d = fleetData || { fleets: [], port: [] };
  const seen = new Map();
  (d.port || []).forEach(p => { if (!seen.has(p.name)) seen.set(p.name, p.count); });
  (d.fleets || []).forEach(f => (f.comp || []).forEach(c => {
    if (!seen.has(c.name)) seen.set(c.name, 0);
  }));
  return [...seen.entries()].map(([name, count]) => ({name, count}));
}
/* 给新行挑一个「还没被本队其它行占用」的舰名，避免默认选到已用过的 */
function _nextFreeName(fid){
  const used = new Set((fleetDraft[fid] || []).map(r => r.name).filter(Boolean));
  const all = _nameChoices();
  const free = all.find(c => !used.has(c.name));
  return (free || all[0] || {name: ''}).name;
}
async function loadFleetComposer(){
  const box = $('fleetComposer');
  if (!box) return;
  box.innerHTML = '<div class="empty">载入中…</div>';
  try {
    const d = await api('/api/fleets');
    fleetData = d;
    _syncDraftFromData(d);
    renderFleetComposer();
  } catch(e){
    box.innerHTML = '<div class="empty">编队面板加载失败：'+esc(e.message)+'</div>';
  }
}
/* 用服务端数据补齐缺失的草稿（新舰队 / 保存后 / 解散后都要用）*/
function _syncDraftFromData(d){
  (d.fleets || []).forEach(f => {
    if (!fleetDraft[f.id]){
      const rows = (f.comp||[]).map(c => ({name:c.name, qty:c.count}));
      // 空舰队也先给一行，否则面板一片空白、点保存也没东西可存
      fleetDraft[f.id] = rows.length ? rows : [{name:'', qty:1}];
    }
  });
  Object.keys(fleetDraft).forEach(k => {
    if (!(d.fleets||[]).some(f => String(f.id) === String(k))) delete fleetDraft[k];
  });
}
function _shipOptions(sel, port){
  // 「请选择港区内舰船」下拉：港区可用 + 本队已有（免得换手时选不到）
  const opts = [];
  const seen = new Set();
  (port||[]).forEach(p => { seen.add(p.name);
    opts.push('<option value="'+esc(p.name)+'"'+(p.name===sel?' selected':'')+'>'
      + esc(p.name)+'（港区 '+p.count+'）</option>'); });
  (fleetData.fleets||[]).forEach(f => (f.comp||[]).forEach(c => {
    if (!seen.has(c.name)){ seen.add(c.name);
      opts.push('<option value="'+esc(c.name)+'"'+(c.name===sel?' selected':'')+'>'
        + esc(c.name)+'（在编 '+c.count+'）</option>'); }
  }));
  if (sel && !seen.has(sel)){
    opts.unshift('<option value="'+esc(sel)+'" selected>'+esc(sel)+'</option>');
  }
  const head = opts.length ? '' :
    '<option value="" selected>（港区没有可用舰船）</option>';
  return head + opts.join('');
}
function renderFleetComposer(){
  const box = $('fleetComposer');
  const d = fleetData;
  const out = [];
  out.push('<div class="item"><b>⚓ 舰队总览</b>'
    + '　共 '+(d.fleets||[]).length+' 支　港区可用 '
    + ((d.port||[]).reduce((a,p)=>a+p.count,0))+' 艘'
    + '　<button class="ghost" id="btnNewFleet">＋ 创建舰队</button>'
    + '<div class="sub">选舰船与数量后点「保存编成」提交；点「添加船型」加一行。'
    + '（数量超过港区可用量时只能编入现有的部分）</div></div>');

  if (!(d.fleets||[]).length){
    out.push('<div class="item"><div class="sub">还没有舰队。'
      + '先「＋ 创建舰队」，再用下面的行挑选舰船组成编队。</div></div>');
  }
  (d.fleets||[]).forEach(f => {
    // 补空行默认值：保证「下拉框显示什么，草稿里就是什么」
    (fleetDraft[f.id] || []).forEach(r => {
      if (!r.name) r.name = _nextFreeName(f.id);
    });
    const rows = (fleetDraft[f.id] || []);
    const body = rows.length ? rows.map((r, i) =>
      '<div class="sub" style="display:flex;gap:6px;align-items:center;margin:3px 0">'

      + '<input type="number" min="0" value="'+(r.qty||0)+'" data-fid="'+f.id
      + '" data-ri="'+i+'" class="fQty" style="width:64px;padding:4px;'
      + 'border-radius:4px;border:1px solid #2a3d4d;background:#0d1a24;color:#dfe9f3">'
      + '<button class="ghost" data-fid="'+f.id+'" data-ri="'+i+'" data-act="del">✕</button>'
      + '</div>').join('')
      : '<div class="sub" style="color:#7f97ad">（空编队，点下面「添加船型」开始）</div>';
    const compTxt = (f.comp||[]).length
      ? (f.comp||[]).map(c => esc(c.name)+'×'+c.count).join('　')
      : '空';
    out.push('<div class="item"><b>'+esc(f.name)+'</b>　('+f.x+','+f.y+')'
      + '　在编 <b>'+f.total+'</b> 艘　航速 '+(f.speed||0)
      + (f.subs_only ? '　<span style="color:#5fd0ff">潜艇队</span>' : '')
      + (f.in_battle ? '　<span style="color:#f2555a">⚔ 交战中（不可调编）</span>' : '')
      + '<div class="sub">当前：'+compTxt+'</div>'
      + body
      + '<div class="sub" style="margin-top:5px">'
      + '<button class="ghost" data-fid="'+f.id+'" data-act="add">＋ 添加船型</button>　'
      + '<button class="ghost" data-fid="'+f.id+'" data-act="save"'
      + (f.in_battle ? ' disabled' : '')+'>💾 保存编成</button>　'
      + '<button class="ghost" data-fid="'+f.id+'" data-act="disband"'
      + (f.in_battle ? ' disabled' : '')+'>🗑 解散舰队</button>'
      + '</div></div>');
  });
  if ((d.port||[]).length){
    out.push('<div class="item"><b>🏭 港区可用舰船</b>'
      + (d.port||[]).map(p => '<div class="sub">'+esc(p.name)
        + '　'+esc(p.tier ? ('T'+p.tier) : '')+'　×'+p.count+'</div>').join('')
      + '</div>');
  }
  box.innerHTML = out.join('');

  const nb = $('btnNewFleet');
  if (nb) nb.onclick = newFleetDialog;
  box.querySelectorAll('button[data-act]').forEach(b => {
    const fid = +b.dataset.fid, act = b.dataset.act;
    b.onclick = () => {
      if (act === 'add'){
        // 默认就用第一个还没占用的舰名 —— 不能留空：
        // 留空的话下拉框会「显示」某艘船，但草稿里 name 仍是空串，
        // 保存时被 filter(r => r.name) 滤掉，看起来就是「点了没反应」。
        (fleetDraft[fid] = fleetDraft[fid] || [])
          .push({name: _nextFreeName(fid), qty: 1});
        renderFleetComposer();
      } else if (act === 'del'){
        fleetDraft[fid].splice(+b.dataset.ri, 1);
        renderFleetComposer();
      } else if (act === 'save'){
        saveFleet(fid);
      } else if (act === 'disband'){
        if (confirm('解散这支舰队？舰船会全部退回港区。')) disbandFleet(fid);
      }
    };
  });
  box.querySelectorAll('select.fShip').forEach(s => {
    s.onchange = () => {
      fleetDraft[+s.dataset.fid][+s.dataset.ri].name = s.value;
      renderFleetComposer();
    };
  });
  box.querySelectorAll('input.fQty').forEach(inp => {
    inp.onchange = () => {
      fleetDraft[+inp.dataset.fid][+inp.dataset.ri].qty = +inp.value || 0;
    };
  });
}

async function saveFleet(fid){
  const want = (fleetDraft[fid] || [])
    .filter(r => r.name && r.qty > 0)
    .map(r => ({name: r.name, qty: r.qty}));
  const cur = (fleetData.fleets || []).find(f => String(f.id) === String(fid));
  // 草稿里一艘都没有、但舰队现在有船 → 这是在清空编队，必须二次确认
  if (!want.length && cur && cur.total > 0){
    if (!confirm('当前没有任何行，保存会把【' + cur.name + '】的 '
        + cur.total + ' 艘船全部退回港区。确定清空吗？')) return;
  }
  try {
    const d = await api('/api/fleet_compose', {method:'POST',
      body: JSON.stringify({fleet_id: fid, want: want})});
    say(d.text || '已保存', 'ok');
    fleetData = d.data;
    // 先按新编成重建草稿再渲染：直接 delete 会让卡片变空，看起来像没保存上
    delete fleetDraft[fid];
    _syncDraftFromData(d.data);
    renderFleetComposer();
    loadAssets();
  } catch(e){ say('保存编成失败：'+e.message, 'err'); }
}
async function disbandFleet(fid){
  try {
    const d = await api('/api/fleet_disband', {method:'POST',
      body: JSON.stringify({fleet_id: fid})});
    say(d.text || '已解散', 'ok');
    fleetData = d.data;
    delete fleetDraft[fid];
    renderFleetComposer();
    loadAssets();
  } catch(e){ say('解散失败：'+e.message, 'err'); }
}

/* ---------- 海图 ---------- */
const COLORS = {capital:'#3fa9f5', own:'#25d0a5', other:'#4a6377',
                base:'#f5b942', patrol:'#f2555a', fleet:'#c98cff',
                merchant:'#e8c46a', enforcer:'#ff6b3d',
                regular:'#d94f4f', guild:'#66d9a0', rebel:'#e07b39',
                yunmo:'#b07bff', empire_merchant:'#ffd166',
                wreck:'#9fb3c8', lease:'#5fd0ff'};
const GLYPH  = {capital:'★', own:'▲', other:'·', base:'⚑', patrol:'✖', fleet:'⛵',
                merchant:'$', enforcer:'!', regular:'R', guild:'G', rebel:'b',
                yunmo:'y', empire_merchant:'$', wreck:'w', lease:'⚓'};
// §6.2 势力图层：他方岛屿按外交关系描边
const REL_RING = {ally:'#25d0a5', war:'#f2555a', protected:'#5fd0ff', nap:'#f5b942'};
const REL_NAME = {ally:'同盟', war:'交战', protected:'中立保护', nap:'互不侵犯'};

let mapCenter = null;   // 战报联动：null=以首都为中心
let mapMark = null;     // 战报联动：{x,y,label}
async function loadMap(){
  try {
    let url = '/api/map?radius=' + radius;
    if (mapCenter) url += '&cx=' + mapCenter[0] + '&cy=' + mapCenter[1];

  } catch(e){ if (curTab==='map') say('海图加载失败：'+e.message,'err'); }
}
/* 战报 → 海图联动：定位到交战坐标 */
function focusOnMap(x, y, label){

  switchTab('map');

function resetMapCenter(){

}

function drawMap(){
  const cv = $('cv'); if (!cv || !mapData) return;
  const ctx = cv.getContext('2d');
  const N = Math.max(mapData.w, mapData.h);
  const size = cv.width, cell = size / N;
  ctx.clearRect(0,0,size,size);
  // 海水底纹
  ctx.fillStyle = '#08131f'; ctx.fillRect(0,0,size,size);
  ctx.strokeStyle = 'rgba(63,169,245,.08)'; ctx.lineWidth = 1;
  for (let i=0;i<=N;i++){
    ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*cell); ctx.lineTo(size,i*cell); ctx.stroke();
  }
  const px = (x) => (x - mapData.x0 + .5) * cell;
  const py = (y) => (y - mapData.y0 + .5) * cell;
  // 战争迷雾：未探明格子压暗（己方目标必在视野内，画在其上不受影响）
  if (mapData.vision) {
    for (let ry = 0; ry < mapData.h; ry++)
      for (let rx = 0; rx < mapData.w; rx++)
        if (!mapData.vision[ry][rx]) {
          ctx.fillStyle = 'rgba(3,8,15,.80)';
          ctx.fillRect(rx*cell, ry*cell, cell, cell);
        }
  }
  const draw = (x, y, kind, label) => {
    ctx.fillStyle = COLORS[kind] || '#888';
    ctx.beginPath(); ctx.arc(px(x), py(y), cell*0.34, 0, Math.PI*2); ctx.fill();
    if (cell > 14) {
      ctx.fillStyle = '#04121d'; ctx.font = 'bold ' + Math.round(cell*0.46) + 'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(GLYPH[kind] || '?', px(x), py(y)+1);
    }
  };
  (mapData.islands||[]).forEach(o => {
    draw(o.x,o.y,o.kind);
    // §6.2 势力图层：外交关系描边
    const ring = REL_RING[o.rel];
    if (ring){
      ctx.strokeStyle = ring; ctx.lineWidth = Math.max(1.5, cell*0.10);
      ctx.beginPath(); ctx.arc(px(o.x), py(o.y), cell*0.44, 0, Math.PI*2); ctx.stroke();
    }
    // §18.3 飞地警示：无港链回首都，产出 ×0.5
    if (o.feat){
      ctx.fillStyle = '#f5b942';
      ctx.beginPath();
      ctx.arc(px(o.x)+cell*0.30, py(o.y)-cell*0.30, cell*0.13, 0, Math.PI*2);
      ctx.fill();
    }
  });
  (mapData.leases ||[]).forEach(o => draw(o.x,o.y,'lease'));
  (mapData.pirates||[]).forEach(o => draw(o.x,o.y,o.kind));
  (mapData.wrecks ||[]).forEach(o => draw(o.x,o.y,'wreck'));
  (mapData.fleets ||[]).forEach(o => draw(o.x,o.y,'fleet'));
  // 视野外边框提示
  ctx.strokeStyle='rgba(63,169,245,.5)'; ctx.lineWidth=2; ctx.strokeRect(1,1,size-2,size-2);
  ctx.fillStyle='#7f97ad'; ctx.font='12px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('北 ↑  中心 '+mapData.center[0]+','+mapData.center[1], 6, 6);
  // 战报联动标记：交战点
  if (mapMark){
    const mx = px(mapMark.x), my = py(mapMark.y);
    ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mx, my, cell*0.62, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mx - cell*0.85, my); ctx.lineTo(mx - cell*0.40, my);
    ctx.moveTo(mx + cell*0.40, my); ctx.lineTo(mx + cell*0.85, my);
    ctx.moveTo(mx, my - cell*0.85); ctx.lineTo(mx, my - cell*0.40);
    ctx.moveTo(mx, my + cell*0.40); ctx.lineTo(mx, my + cell*0.85);
    ctx.stroke();
    ctx.fillStyle = '#ff6b6b'; ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('⚔ ' + mapMark.label, mx, my - cell*0.9);
  }
  const fl = $('fogLegend'); if (fl) fl.style.display = mapData.fog ? '' : 'none';
  const rb = $('btnMapReset'); if (rb) rb.style.display = mapCenter ? '' : 'none';
}

      '">●'+REL_NAME[i.rel]+'</span>') : '';

    parts.push(

    (l.days_left != null ? l.days_left+' 天' : '—')+'</div>'));
  (mapData.pirates||[]).forEach(p => parts.push(
    '<div class="item"><b>'+(p.kind==='patrol'?'✖ 海盗巡逻队':p.kind==='merchant'?'$ 中立商船'
      :p.kind==='enforcer'?'! 跨国执法者':'⚑ 海盗据点')+'</b> '+
    esc(p.name||'')+' ('+p.x+','+p.y+')'+

  (mapData.wrecks||[]).forEach(w => parts.push(
    '<div class="item"><b>'+(w.kind==='yunmo'?'☢️ 雲墨残骸区':'⚓ 沉船遗迹')+
    '</b> ('+w.x+','+w.y+')　剩 '+w.remaining+' 次'+

    '" data-y="'+w.y+'">派舰队打捞</button></div></div>'));
  (mapData.fleets||[]).forEach(f => parts.push(
    '<div class="item"><b>⛵ '+esc(f.name)+'</b> ('+f.x+','+f.y+')</div>'));
  box.innerHTML = parts.length ? parts.join('') : '<div class="empty">视野内暂无目标。</div>';
  box.querySelectorAll('button[data-act=attack]').forEach(b => b.onclick = () => {
    switchTab('cmd'); $('cmd').value = '攻击 ' + (mapData.fleets[0] ? mapData.fleets[0].name : '') +
      ' ' + b.dataset.x + ',' + b.dataset.y; $('cmd').focus();
  });
  box.querySelectorAll('button[data-act=salvage]').forEach(b => b.onclick = () => {
    switchTab('cmd'); $('cmd').value = '打捞 ' + (mapData.fleets[0] ? mapData.fleets[0].name : '') +
      ' ' + b.dataset.x + ',' + b.dataset.y; $('cmd').focus();
  });
}

function renderDiplo(d){
  const box = $('diploList'); if (!box) return;

  if (dp.neutral){
    out.push('<div class="item"><b>🕊 中立观察国</b><div class="sub">'+
      '任何玩家都无法攻击你；代价是你不能宣战、不能使用间谍。</div></div>');
  }
  // 玩家
  const ps = dp.players || [];
  out.push('<div class="item"><b>🧑‍✈️ 其他提督</b>' + (ps.length ? ps.map(p =>
    '<div class="sub">'+ (p.neutral?'🕊 ': (p.state==='war'?'⚔️ ': (p.state==='allied'?'🤝 ':'➖ '))) +
    esc(p.name) +'　'+ esc(p.state_zh) + (p.neutral?'（受中立保护）':'') +
    '</div>').join('') : '<div class="sub">暂无其他玩家</div>') + '</div>');
  // 阵营
  const fs = dp.factions || [];
  out.push('<div class="item"><b>🌐 阵营关系</b>' + (fs.length ? fs.map(f =>
    '<div class="sub">'+ (f.state==='war'?'⚔️ ': (f.state==='peace'?'🤝 ':(f.state==='allied'?'🤝 ':'➖ '))) +
    esc(f.name) +'　'+ esc(f.state_zh) +
    (f.reputation!=null?('　声望 '+fmt(f.reputation)):'') +
    (f.explicit?'　★':'') + '</div>').join('') : '<div class="sub">暂无</div>') + '</div>');
  // 条约
  const ts = dp.treaties || [];
  out.push('<div class="item"><b>📜 条约</b>' + (ts.length ? ts.map(t =>
    '<div class="sub">'+ (t.kind==='vassal'?'🏳 保护关系':'📜 互不侵犯') +
    '（与 '+esc(t.other_name)+'）' + (t.role?('　你是'+t.role):'') +
    '　剩 '+t.days_left+' 天</div>').join('') : '<div class="sub">无生效条约</div>') + '</div>');
  // 租借军港
  const ls = dp.leases || [];
  out.push('<div class="item"><b>⚓ 租借军港</b>' + (ls.length ? ls.map(l =>
    '<div class="sub">('+l.x+','+l.y+')　东家 '+esc(l.owner)+'　剩 '+l.days_left+' 天</div>'
    ).join('') : '<div class="sub">无</div>') + '</div>');
  // 宗主 / 附庸
  if (dp.liege || (dp.vassals||[]).length){
    const bits = [];
    if (dp.liege) bits.push('你是 <b>'+esc(dp.liege)+'</b> 的附庸');
    if ((dp.vassals||[]).length) bits.push('你的附庸：'+ (dp.vassals||[]).map(esc).join('、'));
    out.push('<div class="item"><b>🏳 保护关系</b><div class="sub">'+bits.join('　')+'</div></div>');
  }
  // 生效事件（§8）
  const es = d.events || [];
  if (es.length){
    out.push('<div class="item"><b>📢 生效事件</b>' + es.map(e =>
      '<div class="sub">'+esc(e.name)+'　'+esc(e.desc||'')+
      (Object.keys(e.eF||{}).length?('　产出 '+Object.entries(e.eF).map(([k,v])=>k+'×'+v).join('、')):'')+
      '</div>').join('') + '</div>');
  }
  // §6.2 市场公开挂单
  const mk = dp.market || [];
  if (mk.length){
    out.push('<div class="item"><b>🏪 市场挂单</b>' + mk.map(m =>
      '<div class="sub">#'+m.id+'　'+(m.mine?'（我挂的）':'【'+esc(m.from_name)+'】')+
      '给 '+fmt(m.give_amt)+' '+esc(m.give_res)+
      ' ↔ 要 '+fmt(m.want_amt)+' '+esc(m.want_res)+
      (m.at_war ? '　<span style="color:#f2555a">⚔ 交战不可接</span>'
                : (m.mine ? '' : '　<button class="ghost" data-trade="'+m.id+
                   '">接单</button>'))+
      '</div>').join('') + '</div>');
  }
  box.innerHTML = out.join('');
  box.querySelectorAll('button[data-trade]').forEach(b => b.onclick = () => {
    switchTab('cmd'); $('cmd').value = '贸易接受 ' + b.dataset.trade; $('cmd').focus();
  });
}

let battleData = null, replayRound = 0, replayTimer = null;
async function loadBattles(){
  const box = $('battleList'); if (!box) return;
  try {
    const d = await api('/api/battles');
    const bs = d.battles || [];
    if (!bs.length){
      box.innerHTML = '<div class="empty">还没有战斗记录。用指令开一场就有了。</div>';
      $('battleView').innerHTML = '';
      return;
    }
    box.innerHTML = '<div class="item"><b>🎬 我的战斗</b>' + bs.map(b =>
      '<div class="sub" style="cursor:pointer" data-bid="'+b.id+'">'+
      (b.won?'🏆':(b.lost?'☠️':'↩️')) + ' #'+b.id+'　vs '+esc(b.opponent)+
      '　('+b.x+','+b.y+')　'+b.rounds+' 轮　'+
      (b.detail?esc(b.detail):(b.status==='active'?'进行中':'已结束'))+
      '</div>').join('') + '</div>';
    box.querySelectorAll('[data-bid]').forEach(el => el.onclick = () => openBattle(+el.dataset.bid));
  } catch(e){ box.innerHTML = '<div class="empty">战报加载失败：'+esc(e.message)+'</div>'; }

async function openBattle(bid){
  try {
    battleData = await api('/api/battle/' + bid);
    replayRound = 0; stopReplay(); renderBattle();
  } catch(e){ $('battleView').innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
}
function stopReplay(){ if (replayTimer){ clearInterval(replayTimer); replayTimer = null; } }
function hpBar(label, hp, mx, units){
  const pct = mx > 0 ? Math.max(0, Math.min(100, hp / mx * 100)) : 0;
  const color = pct > 66 ? '#25d0a5' : (pct > 33 ? '#f5b942' : '#f2555a');
  return '<div class="sub">'+esc(label)+'　'+fmt(hp)+' / '+fmt(mx)+
    '　舰船 '+units+'　<b>'+pct.toFixed(0)+'%</b>'+
    '<div style="height:10px;background:#12222f;border-radius:5px;margin-top:3px;overflow:hidden">'+
    '<div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+color+'"></div></div></div>';
}
function renderBattle(){
  const box = $('battleView'); if (!box || !battleData) return;
  const d = battleData;
  const total = (d.rounds||[]).length;
  const out = [];
  out.push('<div class="item"><b>🎬 战斗 #'+d.id+'</b>　('+d.x+','+d.y+')'+
    '<div class="sub">'+esc(d.a_name)+' vs '+esc(d.b_name)+
    '　你属 '+d.my_side+' 方</div>'+
    '<div class="sub">'+(d.detail?esc(d.detail):'')+'</div>'+
    '<div class="sub"><button class="ghost" id="rvMap">🗺 在海图上查看这一战</button></div>'+
    '</div>');
  // 兵力变化（取当前轮的快照；第 0 轮是开战前）
  const shown = (d.rounds||[]).slice(0, replayRound);
  let snap = null;
  for (const r of shown) if (r.snap) snap = r.snap;
  if (!snap && total) snap = (d.rounds[0]||{}).snap;
  if (snap){
    const aLabel = d.a_name + (d.my_side==='A' ? '（你）' : '');
    const bLabel = d.b_name + (d.my_side==='B' ? '（你）' : '');
    out.push('<div class="item"><b>❤️ 兵力对比</b>' +
      hpBar(aLabel, snap.a_hp, snap.a_max, snap.a_units) +
      hpBar(bLabel, snap.b_hp, snap.b_max, snap.b_units) + '</div>');
  }
  // 功勋表
  if ((d.damage||[]).length){
    out.push('<div class="item"><b>📊 战功与伤害贡献</b>' + d.damage.map(x =>
      '<div class="sub">'+esc(x.name)+'　伤害 '+fmt(x.damage)+
      '（'+(x.share*100).toFixed(0)+'%）　击沉 '+x.kills+'　承受 '+fmt(x.lost)+
      '</div>').join('') + '</div>');
  }
  // 回放控制
  out.push('<div class="item"><b>⏯ 逐轮回放</b>'+
    '<div class="sub">第 <b id="rvNo">'+replayRound+'</b> / '+total+' 轮</div>'+
    '<div class="sub">'+
    '<button class="ghost" id="rvPrev">◀ 上一轮</button> '+
    '<button class="ghost" id="rvNext">下一轮 ▶</button> '+
    '<button class="ghost" id="rvPlay">▶ 自动播放</button> '+
    '<button class="ghost" id="rvStop">⏸ 停止</button>'+
    '</div></div>');
  out.push('<div class="item"><b>📜 流水</b>' + (shown.length ? shown.map(r =>
    '<div class="sub"><b>—— 第'+r.no+'轮 ——</b></div>' +
    r.lines.map(l => '<div class="sub">'+esc(l)+'</div>').join('')
    ).join('') : '<div class="sub">点「下一轮 ▶」开始回放</div>') + '</div>');
  if (replayRound >= total && d.summary){
    out.push('<div class="item"><b>🏁 战报</b>' +
      d.summary.split('\n').map(l => '<div class="sub">'+esc(l)+'</div>').join('') + '</div>');
  }
  box.innerHTML = out.join('');
  if ($('rvMap')) $('rvMap').onclick = () => focusOnMap(d.x, d.y, '#'+d.id);
  $('rvPrev').onclick = () => { stopReplay(); replayRound = Math.max(0, replayRound-1); renderBattle(); };
  $('rvNext').onclick = () => { stopReplay(); replayRound = Math.min(total, replayRound+1); renderBattle(); };
  $('rvStop').onclick = () => { stopReplay(); };
  $('rvPlay').onclick = () => {
    stopReplay();
    if (replayRound >= total) replayRound = 0;
    replayTimer = setInterval(() => {
      replayRound++;
      if (replayRound > total){ stopReplay(); return; }
      renderBattle();
      if (replayRound >= total) stopReplay();
    }, 900);
  };
}

/* ---------- 📐 设计图鉴 ---------- */
const STAT_ORDER = ['hp','fire','torpedo','asw','aa','speed','detect','hit'];
const STAT_MAX = {hp:2500, fire:60, torpedo:70, asw:50, aa:40, speed:26, detect:20, hit:8};
const STAT_LABEL = {hp:'耐久', fire:'火力', torpedo:'鱼雷', asw:'反潜',
                    aa:'防空', speed:'航速', detect:'探测', hit:'命中'};
const COST_LABEL = {steel:'钢', oil:'油', money:'资金', manpower:'人力',
                    aluminium:'铝', rare_earth:'稀土'};
function statBar(label, val, ref){
  const pct = ref > 0 ? Math.max(0, Math.min(100, val / ref * 100)) : 0;
  return '<div class="sub" style="display:flex;align-items:center;gap:6px">'+
    '<span style="width:32px;color:#7f97ad">'+esc(label)+'</span>'+
    '<span style="flex:1;height:8px;background:#12222f;border-radius:4px;overflow:hidden">'+
    '<span style="display:block;height:100%;width:'+pct.toFixed(1)+'%;background:#3fa9f5"></span></span>'+
    '<span style="width:48px;text-align:right"><b>'+val+'</b></span></div>';
}
function renderDesigns(d){
  const box = $('codexList'); if (!box) return;
  const ds = d.designs || [];
  if (!ds.length){
    box.innerHTML = '<div class="empty">还没有设计。用指令 <code>设计</code> 进入设计模式，'+
      '或 <code>设计列表</code> 查看。</div>';
    return;
  }
  // 同一玩家内取最大值做参照，条长才有可比性
  const localMax = {};
  STAT_ORDER.forEach(k => {
    localMax[k] = Math.max(...ds.map(x => Number((x.stats||{})[k]) || 0), 1);
  });
  box.innerHTML = ds.map(x => {
    const st = x.stats || {};
    const bars = STAT_ORDER.filter(k => (Number(st[k])||0) > 0).map(k =>
      statBar(STAT_LABEL[k] || k, Number(st[k])||0,
              Math.max(localMax[k], (STAT_MAX[k]||100) * 0.35))).join('');
    const cost = Object.entries(x.cost || {})
      .map(([k,v]) => COST_LABEL[k] ? (COST_LABEL[k]+' '+fmt(v)) : (k+' '+fmt(v)))
      .join('　');
    const mods = (x.modules || []).map(m =>
      esc(m.slot_name)+'：'+esc(m.name)).join('　');
    const cv = x.cv ? ('　🛩 机库'+x.cv.hangar+' 单波'+x.cv.wave+
                       ' 甲板'+x.cv.deck_hp+'　'+esc(x.cv.name)) : '';
    return '<div class="item"><b>📐 '+esc(x.name)+'</b>'+
      '<div class="sub">'+esc(x.class_name)+'　T'+x.tier+
      '　综合战力 <b style="color:#25d0a5">'+x.power+'</b>'+cv+'</div>'+
      bars+
      (mods ? '<div class="sub" style="margin-top:4px;color:#7f97ad">🔧 '+mods+'</div>' : '')+
      '<div class="sub" style="margin-top:4px">💰 '+cost+'</div></div>';
  }).join('');
}

/* ---------- 🔬 科技树 ---------- */
const RARITY_COLOR = {white:'#8fa3b5', blue:'#3fa9f5', purple:'#b07bff', gold:'#f5b942'};
function renderTech(d){
  const box = $('techList'); if (!box) return;
  const r = d.research || {};
  const out = [];
  // 研究所概览
  out.push('<div class="item"><b>🔬 研究所 Lv'+(r.lab_level||0)+'</b>'+
    '<div class="sub">并行研究位 <b>'+(r.slots||0)+'</b>　可研究上限 '+
    '<b>T'+(r.max_tier||0)+'</b>'+
    (r.proving_level ? ('　试验场 Lv'+r.proving_level) : '')+'</div>'+
    '<div class="sub">蓝图收集 <b>'+(r.owned_total||0)+'</b> / '+(r.pool_total||0)+
    '</div>'+
    ((r.lab_level||0) < 5 ? '<div class="sub">建/升级研究所可解锁更高的 T 池'+
      '（Lv1=T1 … Lv5=T5）</div>' : '')+
    '</div>');
  // 代际进度
  const tiers = r.tiers || [];
  if (tiers.length){
    out.push('<div class="item"><b>📶 代际进度</b>' + tiers.map(t => {
      const pct = t.total > 0 ? (t.owned / t.total * 100) : 0;
      return '<div class="sub" style="display:flex;align-items:center;gap:8px">'+
        '<span style="width:34px;color:'+(t.unlocked?'#25d0a5':'#5a6e80')+'">T'+t.tier+'</span>'+
        '<span style="flex:1;height:9px;background:#12222f;border-radius:4px;overflow:hidden">'+
        '<span style="display:block;height:100%;width:'+pct.toFixed(1)+'%;background:'+
        (t.unlocked?'#3fa9f5':'#33475a')+'"></span></span>'+
        '<span style="width:110px;text-align:right;color:#7f97ad">'+
        (t.unlocked ? (t.owned+'/'+t.total) : '🔒 未解锁')+
        (t.mult ? ('　×'+t.mult) : '')+'</span></div>';
    }).join('') + '</div>');
  }
  // 研究队列
  const q = r.queue || [];
  if (q.length){
    out.push('<div class="item"><b>⏳ 研究队列</b>' + q.map(x => {
      const m = Math.floor(x.left/60), sec = x.left % 60;
      return '<div class="sub">'+esc(x.unit_type)+' T'+x.tier+
        (x.mode==='express'?'（加急）':'')+'　剩 '+m+'分'+sec+'秒</div>';
    }).join('') + '</div>');
  }
  // 碎片与保底
  const fr = r.fragments || [];
  out.push('<div class="item"><b>🧩 蓝图碎片</b>' + (fr.length ? fr.map(f =>
    '<div class="sub">T'+f.tier+'　<span style="color:'+
    (RARITY_COLOR[f.rarity]||'#888')+'">'+esc(f.rarity_name)+'</span>'+
    '　'+f.amount+' / '+f.exchange+
    (f.enough?'　<b style="color:#25d0a5">可兑换</b>':'')+'</div>').join('')
    : '<div class="sub">暂无碎片（重复蓝图会转为碎片，可攒够兑换指定模块）</div>') +
    '</div>');
  const pt = r.pity || [];
  if (pt.length){
    out.push('<div class="item"><b>🎯 保底计数</b>' + pt.map(p =>
      '<div class="sub">'+esc(p.pool)+'　距蓝 '+(p.since_blue||0)+'/'+p.need_blue+
      '　距紫 '+(p.since_purple||0)+'/'+p.need_purple+
      '　距金 '+(p.since_gold||0)+'/'+p.need_gold+'</div>').join('') + '</div>');
  }
  // 收集网格（舰种 × 代际）
  const grid = r.grid || [];
  if (grid.length){
    out.push('<div class="item"><b>🗺 收集度（舰种 × 代际）</b>' + grid.map(g =>
      '<div class="sub">'+esc(g.name)+'　' + g.cells.map(c => {
        const fl = c.owned > 0 ? '#3fa9f5' : '#1b2b39';
        const txt = c.owned >= c.total && c.total > 0 ? '#25d0a5' : '#cfe3f5';
        return '<span style="display:inline-block;margin-right:4px;padding:1px 6px;'+
          'border-radius:4px;background:'+fl+';color:'+txt+'">T'+c.tier+
          ' '+c.owned+'/'+c.total+'</span>';
      }).join('') + '</div>').join('') + '</div>');
  }
  // 最近获得的蓝图
  const rc = r.recent || [];
  if (rc.length){
    out.push('<div class="item"><b>🆕 最近获得</b>' + rc.map(b =>
      '<div class="sub"><span style="color:'+(RARITY_COLOR[b.rarity]||'#888')+'">'+
      '●</span> '+esc(b.name)+'　T'+(b.tier||'?')+
      (b.cls?('　'+esc(b.cls)):'')+'</div>').join('') + '</div>');
  }
  const rr = r.rarity || {};
  const rl = Object.entries(rr).map(([k,v]) =>
    '<span style="color:'+(RARITY_COLOR[k]||'#888')+'">'+esc(v.name||k)+
    ' '+v.weight+'%</span>').join('　');
  if (rl) out.push('<div class="item"><b>🎲 出货权重</b><div class="sub">'+rl+'</div></div>');
  box.innerHTML = out.join('');
}

/* ---------- 控制台 ---------- */
function say(text, cls='bot'){
  const div = document.createElement('div');
  div.className = 'line ' + cls; div.textContent = text;
  $('console').appendChild(div); $('console').scrollTop = $('console').scrollHeight;
}
const QUICK = ['我','资源','岛','队列','排行','帮助','研究 驱逐舰 T3','设计','设计列表','船坞','舰队','海图','战报'];
function renderQuick(){
  if ($('quick').children.length) return;
  QUICK.forEach(c => { const b=document.createElement('button'); b.textContent=c; b.onclick=()=>send(c); $('quick').appendChild(b); });
}
async function send(text){
  text = (text||'').trim(); if (!text || needSet) return;
  say(text,'me'); $('cmd').value='';
  try {
    const d = await api('/api/cmd', {method:'POST', body: JSON.stringify({text})});
    (d.replies||[]).forEach(r => say(r,'bot'));
    if (d.player) renderPlayer(d.player);
    if (curTab==='map') loadMap();
  } catch(e){ say(e.message,'err'); if (e.status===403){ needSet=true; show('setup'); } }
}
async function pollEvents(){
  if (!TOKEN) return;
  try {
    const d = await api('/api/events');
    (d.events||[]).forEach(ev => say(ev.text,'bot'));
    if ((d.events||[]).length){ const me = await api('/api/me'); renderPlayer(me.player); loadMap(); }
  } catch(e){}
}

/* ---------- 事件 ---------- */
$('btnLogin').onclick = async () => {
  const qq=$('qq').value.trim(), pw=$('pw').value, m=$('loginMsg');
  m.textContent=''; m.className='msg err';
  if(!qq){ m.textContent='请输入 QQ 号'; return; }
  $('btnLogin').disabled=true;
  try {
    const d = await api('/api/login',{method:'POST',body:JSON.stringify({qq,password:pw})});
    TOKEN=d.token; localStorage.setItem('nw_token',TOKEN);
    if (d.need_set_password){ needSet=true; show('setup'); }
    else { needSet=false; enterGame(await api('/api/me')); }
  } catch(e){ m.textContent=e.message; } finally { $('btnLogin').disabled=false; }
};
$('pw').addEventListener('keydown', e => { if(e.key==='Enter') $('btnLogin').click(); });
$('btnSet').onclick = async () => {
  const a=$('npw').value,b=$('npw2').value,m=$('setupMsg'); m.className='msg err'; m.textContent='';
  if(a!==b){ m.textContent='两次输入不一致'; return; }
  try {
    const d = await api('/api/password',{method:'POST',body:JSON.stringify({new_password:a})});
    TOKEN=d.token; localStorage.setItem('nw_token',TOKEN); needSet=false;
    m.className='msg ok'; m.textContent='口令已设置';
    enterGame(await api('/api/me'));
  } catch(e){ m.textContent=e.message; }
};
async function doLogout(){
  try { await api('/api/logout',{method:'POST'}); } catch(e){}
  TOKEN=''; localStorage.removeItem('nw_token');
  if(polling){ clearInterval(polling); polling=null; } location.reload();
}
$('btnQuit').onclick = doLogout;
$('btnLogout').onclick = doLogout;
$('btnSend').onclick = () => send($('cmd').value);
$('cmd').addEventListener('keydown', e => { if(e.key==='Enter') send($('cmd').value); });
$('btnRefreshMap').onclick = () => loadMap();
$('btnMapReset').onclick = () => resetMapCenter();
$('radius').oninput = () => { radius = +$('radius').value; $('radiusVal').textContent = radius; loadMap(); };
$('cv').addEventListener('click', ev => {
  if (!mapData) return;
  const cv = $('cv'), r = cv.getBoundingClientRect();
  const N = Math.max(mapData.w, mapData.h), cell = cv.width / N;
  const gx = mapData.x0 + Math.floor((ev.clientX - r.left) / r.width  * cv.width  / cell);
  const gy = mapData.y0 + Math.floor((ev.clientY - r.top ) / r.height * cv.height / cell);
  const hit = (mapData.fleets||[]).find(f=>f.x===gx&&f.y===gy)
           || (mapData.pirates||[]).find(p=>p.x===gx&&p.y===gy);
  const tip = $('tip');
  tip.textContent = hit ? ((hit.name||'目标') + ' ('+gx+','+gy+')') : ('('+gx+','+gy+') 空海域');
  tip.style.display='block';
  tip.style.left = Math.min(ev.clientX - r.left + 10, r.width - 130) + 'px';
  tip.style.top  = (ev.clientY - r.top + 10) + 'px';
  setTimeout(()=>{ tip.style.display='none'; }, 2200);
});

renderQuick();
boot();
</script>
